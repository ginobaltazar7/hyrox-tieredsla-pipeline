name: HYROX_Q1_Q2_SEMANTIC_VIEW
description: "Full Hyrox Q1/Q2 demo view. Tables have different grains and no relationships: answer each question from a single table. No location, season, points, or podium data is in this view, and no lsa race result is in this view."
tables:
  - name: Q1L
    description: "One row per result per station, elite/pro only, 3,200 rows. Station-transition time per result, per station."
    base_table:
      database: SPORTS_ANALYTICS_DB
      schema: RAW_BRONZE
      table: Q1_STATION_LONG
    primary_key:
      columns:
        - RESULT_ID
        - STATION
    dimensions:
      - name: DIVISION
        description: "Division of the result: doubles, open, pro, pro_doubles, elite, elite_doubles."
        expr: DIVISION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STATION
        description: "Hyrox station, for example SLEDPULL_TIME, WALLBALLS. Group by this column."
        expr: STATION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: TRANSITION_TIME
        description: "Time from the start of the station to the end of the station, in minutes. The station duration."
        expr: TRANSITION_TIME
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: AVG_TRANSITION_TIME
        description: "Average station-transition time in minutes, grouped by station and division, or pooled over all 3,200 splits."
        expr: AVG(q1l.transition_time)
        access_modifier: public_access
  - name: Q1V
    description: "One row per station, elite/pro only. Precomputed station-transition variance."
    base_table:
      database: SPORTS_ANALYTICS_DB
      schema: RAW_BRONZE
      table: Q1_STATION_VARIANCE
    primary_key:
      columns:
        - STATION
    dimensions:
      - name: STATION
        description: "Hyrox station, for example SLEDPULL_TIME, WALLBALLS. Group by this column."
        expr: STATION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: N_OBS
        description: Results behind the station variance. 400 for every station.
        expr: N_OBS
        data_type: "NUMBER(18,0)"
        access_modifier: public_access
      - name: TRANSITION_TIME_VARIANCE
        description: Precomputed sample VARIANCE of station transition time. Group by station only. Do NOT sum across stations.
        expr: TRANSITION_TIME_VARIANCE
        data_type: FLOAT
        access_modifier: public_access
  - name: Q2C
    description: "One row per division plus a pooled row covering all 5,000 results. Precomputed averages and correlation. Do not average these averages again, and do not sum N across all rows."
    base_table:
      database: SPORTS_ANALYTICS_DB
      schema: RAW_BRONZE
      table: Q2_DEVIATION_CORRELATION
    primary_key:
      columns:
        - DIVISION
    dimensions:
      - name: DIVISION
        description: "Division for the correlation row, or the pooled row covering all divisions."
        expr: DIVISION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: AVG_DEGRADATION
        description: Precomputed average station degradation for this division. Do not average again.
        expr: AVG_DEGRADATION
        data_type: FLOAT
        access_modifier: public_access
      - name: AVG_DEVIATION
        description: Precomputed average first-km deviation for this division. Do not average again.
        expr: AVG_DEVIATION
        data_type: FLOAT
        access_modifier: public_access
      - name: CORR_DEV_VS_DEGRADATION
        description: "Precomputed correlation between starting deviation and degradation for this division. Association, not causation."
        expr: CORR_DEV_VS_DEGRADATION
        data_type: FLOAT
        access_modifier: public_access
      - name: "N"
        description: "Results in this division. Pooled row is 5,000."
        expr: "N"
        data_type: "NUMBER(18,0)"
        access_modifier: public_access
  - name: Q2D
    description: "One row per result, all divisions, 5,000 rows. First-km deviation and station degradation per result."
    base_table:
      database: SPORTS_ANALYTICS_DB
      schema: RAW_BRONZE
      table: Q2_STATION_DEGRADATION
    primary_key:
      columns:
        - RESULT_ID
    dimensions:
      - name: DIVISION
        description: "Division of the result: doubles, open, pro, pro_doubles, elite, elite_doubles."
        expr: DIVISION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: FIRST_KM_DEVIATION
        description: "Run1 minus the athlete mean of runs 1 to 8, in minutes. Negative means the athlete started faster than their own mean."
        expr: FIRST_KM_DEVIATION
        data_type: FLOAT
        access_modifier: public_access
      - name: STATION_DEGRADATION
        description: "Wallballs time minus skierg time, in minutes. Positive means the athlete slowed from first to last station."
        expr: STATION_DEGRADATION
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: AVG_FIRST_KM_DEVIATION
        description: "Average first-km deviation in minutes, grouped by division, or pooled over all 5,000 results."
        expr: AVG(q2d.first_km_deviation)
        access_modifier: public_access
      - name: AVG_STATION_DEGRADATION
        description: "Average station degradation in minutes, grouped by division, or pooled over all 5,000 results."
        expr: AVG(q2d.station_degradation)
        access_modifier: public_access
