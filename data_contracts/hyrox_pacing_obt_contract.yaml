# YAML manifest for the Hyrox Gold Pacing OBT data contract. 
# This contract defines the schema, fields, and service levels for the gold table that backs the analyst dashboards (Q1–Q5). 
# The table is currently a direct SELECT * from the silver staging table stg_hyrox_races, but if WAP becomes the gold writer, this contract must be re-verified.

dataContractSpecification: "2.5.0"

id: "urn:datacontract:hyrox:pacing_obt"

info:
  title: "Hyrox Gold Pacing OBT"
  version: "1.0.0"
  description: >
    Curated gold table backing the analyst dashboards (Q1–Q5). One row per race
    result. Currently a straight SELECT * from silver stg_hyrox_races; if WAP ever
    becomes the gold writer (ownership TBD), this contract must be re-verified.
  owner: "Gino Baltazar"
  contact:
    url: "https://github.com/ginobaltazar7/hyrox-tieredsla-pipeline"

servers:
  production:
    type: snowflake
    # Credentials resolve from SNOWFLAKE_ACCOUNT / SNOWFLAKE_USER /
    # SNOWFLAKE_PASSWORD / SNOWFLAKE_WAREHOUSE at runtime (see .github/workflows/hyrox-ci.yml).
    database: SPORTS_ANALYTICS_DB
    schema: GOLD_MARKETING
    table: pacing_obt

models:
  pacing_obt:
    description: "One row per Hyrox race result; grain is result_id."
    fields:
      result_id:
        type: "string"
        required: true
        primary: true
        unique: true
        description: "Result-row grain: source_result_id when present, else res_synth_ + sha256(event_id|name|division|total_time)."
      source_result_id:
        type: "string"
        required: false
        description: "Raw source ID; NULL for ~698K rows — lineage only, never the grain."
      event_id:
        type: "string"
        required: true
        description: "Event identifier; zero nulls observed; anchors the synthetic result_id hash."
      athlete_id:
        type: "string"
        required: true
        description: "Best-effort person identity: sha256(name|gender|nationality|age_group), rule v1."
      name:
        type: "string"
        required: false
      gender:
        type: "string"
        required: false
      nationality:
        type: "string"
        required: false
      age_group:
        type: "string"
        required: false
      division:
        type: "string"
        required: false
        description: "Doubles/relay encoded here (elite_doubles, doubles, pro_doubles, relay)."
      season:
        type: "integer"
        required: false
        description: "NULLABLE — never default missing values to 8."
      year:
        type: "integer"
        required: false
      event_name:
        type: "string"
        required: false
      location:
        type: "string"
        required: false
      total_time_minutes:
        type: "number"
        required: true
        minimum: 0
      run1_time:
        type: "number"
        required: false
        minimum: 0
      run2_time:
        type: "number"
        required: false
        minimum: 0
      run3_time:
        type: "number"
        required: false
        minimum: 0
      run4_time:
        type: "number"
        required: false
        minimum: 0
      run5_time:
        type: "number"
        required: false
        minimum: 0
      run6_time:
        type: "number"
        required: false
        minimum: 0
      run7_time:
        type: "number"
        required: false
        minimum: 0
      run8_time:
        type: "number"
        required: false
        minimum: 0
      skierg_time:
        type: "number"
        required: false
        minimum: 0
      sledpush_time:
        type: "number"
        required: false
        minimum: 0
      sledpull_time:
        type: "number"
        required: false
        minimum: 0
      burpeebroadjump_time:
        type: "number"
        required: false
        minimum: 0
      rowerg_time:
        type: "number"
        required: false
        minimum: 0
      farmerscarry_time:
        type: "number"
        required: false
        minimum: 0
      sandbaglunges_time:
        type: "number"
        required: false
        minimum: 0
      wallballs_time:
        type: "number"
        required: false
        minimum: 0
      roxzone_time:
        type: "number"
        required: false
        minimum: 0
      run_time:
        type: "number"
        required: false
        minimum: 0
      work_time:
        type: "number"
        required: false
        minimum: 0
      best_run_lap:
        type: "number"
        required: false
        minimum: 0
      updated_at:
        type: "timestamp"
        required: true
        description: "Pipeline load time; DEFAULT CURRENT_TIMESTAMP() in Snowflake."

servicelevels:
  availability:
    description: "Daily pipeline SLA — task chain runs once per day."
    percentage: 99.0
    period: "daily"
  freshness:
    description: "Gold refreshed within 24h of the scheduled daily run."
    period: "daily"
