SQL
-- SPCS Service Job for running dbt Silver models
CREATE OR REPLACE SERVICE 
SPORTS_ANALYTICS_DB.SILVER.dbt_silver_job
  IN COMPUTE POOL dbt_compute_pool
  FROM SPECIFICATION '
  spec:
    containers:
      - name: dbt-silver
        image: your_org_registry/sports_analytics/dbt_core:latest
        command: ["dbt", "run", "--select", "silver", "--profiles-dir", "."]
    ';

-- SPCS Service Job for running dbt Gold models
CREATE OR REPLACE SERVICE SPORTS_ANALYTICS_DB.GOLD_MARKETING.dbt_gold_job
  IN COMPUTE POOL dbt_compute_pool
  FROM SPECIFICATION '
  spec:
    containers:
      - name: dbt-gold
        image: your_org_registry/sports_analytics/dbt_core:latest
        command: ["dbt", "run", "--select", "gold", "--profiles-dir", "."]
    ';
