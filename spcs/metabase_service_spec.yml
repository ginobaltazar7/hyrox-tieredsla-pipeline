CREATE OR REPLACE SERVICE SPORTS_ANALYTICS_DB.GOLD_MARKETING.metabase_service
  IN COMPUTE POOL metabase_compute_pool
  FROM SPECIFICATION '
spec:
  containers:
    - name: metabase
      image: metabase/metabase:latest
      env:
        MB_DB_TYPE: h2
  endpoints:
    - name: metabase-ui
      port: 3000
      public: true
';