models:
  - name: q1_station_variance
    description: "Per-station variance of Hyrox station split times for the elite-pro union (pro, pro_doubles, elite, elite_doubles; 400 results). One row per station, built from q1_station_long. Note: splits are station work times, not transition times; roxzone is excluded."
    semantic_model:
      enabled: true
      name: station_variance
    agg_time_dimension: variance_date
    columns:
      - name: station
        description: "Station split name (e.g. SLEDPULL_TIME), one of the 8 station splits."
        entity:
          type: primary
          name: station
      - name: variance_date
        description: "Fixed sentinel date satisfying MetricFlow's required agg_time_dimension. Not an event date; never use for time slicing."
        granularity: day
        dimension:
          type: time
    metrics:
      - name: transition_time_variance_elite_pro
        description: "Sample variance of station split times across the elite-pro union, by station. Passthrough: sum over the precomputed per-station variance, one row per station, so sum returns the value unchanged. Group by station only; never sum across stations."
        label: "Transition Time Variance, Elite/Pro"
        type: simple
        agg: sum
        expr: transition_time_variance
  - name: q2_station_degradation
    description: "Per-result pacing fields for Q2: first-km deviation vs later-station degradation. One row per result."
    agg_time_dimension: pacing_date
    columns:
      - name: result_id
        description: "Result grain key, one row per result."
        entity:
          type: primary
          name: result_id
      - name: division
        description: "Division, the Q2 grouping dimension."
        dimension:
          type: categorical
      - name: pacing_date
        description: "Fixed sentinel date satisfying MetricFlow's required agg_time_dimension. Not an event date; never use for time slicing."
        granularity: day
        dimension:
          type: time
    metrics:
      - name: avg_first_km_deviation
        description: "Average first-km deviation (run1 minus athlete own mean run time) by division."
        label: "Average First-Km Deviation"
        type: simple
        agg: average
        expr: first_km_deviation
      - name: avg_station_degradation
        description: "Average station degradation (wall balls minus SkiErg) by division."
        label: "Average Station Degradation"
        type: simple
        agg: average
        expr: station_degradation
    semantic_model:
      name: result_pacing
      enabled: true


