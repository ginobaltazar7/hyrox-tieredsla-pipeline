name: 'sports_analytics'
version: '1.0.0'
config-version: 2

profile: 'sports_analytics'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sports_analytics:
    silver:
      +materialized: incremental
      +unique_key:
        - athlete_id
        - season
    gold_marketing:
      +materialized: table
flags:
  require_generic_test_arguments_property: true